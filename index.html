#stage[data-theme="champagne"]{--bg1:#e6d9bd;--bg2:#d8c8a8;--bg3:#c9b489;--wave:#b08d57;--wave2:#ffe9b8;--dim:#fff8e7;--panel:rgba(120,90,40,.18)}
#stage[data-theme="navy"]{--bg1:#08224e;--bg2:#041634;--bg3:#020914;--wave:#dbeaff;--wave2:#6ea8ff;--dim:#aebdd2;--panel:rgba(2,10,30,.35)}
#stage[data-theme="burgundy"]{--bg1:#2a0618;--bg2:#1c0411;--bg3:#12030c;--wave:#ff7a9a;--wave2:#a02048;--dim:#c9a3b2;--panel:rgba(30,0,14,.32)}
#fade{position:absolute;inset:0;background:var(--bg2);opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
#banner{position:absolute;inset:0;opacity:0;transition:opacity .7s;z-index:1;background-size:cover;background-position:center}
#banner.on{opacity:1}
#banner .blabel{position:absolute;right:28px;bottom:54px;font-size:28px;font-weight:600;letter-spacing:.04em;text-shadow:0 2px 18px rgba(0,0,0,.8);opacity:.92}
#banner .bgrad{position:absolute;inset:0}
#waves{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.95}
#ui{position:absolute;inset:0;z-index:5}
#status{position:absolute;top:14px;right:18px;display:flex;gap:9px;align-items:center;font-size:16px;font-weight:500;letter-spacing:.03em;text-shadow:0 0 7px rgba(255,255,255,.65),0 1px 3px rgba(0,0,0,.7);z-index:20}
.batt{width:27px;height:13px;border:1.6px solid rgba(255,255,255,.95);border-radius:3px;position:relative;opacity:.95;box-shadow:0 0 6px rgba(255,255,255,.25),inset 0 0 4px rgba(255,255,255,.15)}
.batt:after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:#fff;border-radius:0 2px 2px 0}
.batt i{position:absolute;left:2px;top:2px;bottom:2px;width:75%;background:#fff;opacity:.85}
#catbar{position:absolute;top:118px;left:0;height:86px;width:100%;z-index:10}
#catTrack{position:absolute;top:0;left:0;display:flex;transition:transform .55s cubic-bezier(.22,.9,.28,1);will-change:transform}
.cat{width:92px;flex:0 0 92px;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#d2d6da;opacity:.74;transition:opacity .3s,color .3s,transform .3s}
.cat img{width:54px;height:54px;object-fit:contain;overflow:visible;}
.cat svg{width:54px;height:54px;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)) drop-shadow(0 0 5px rgba(255,255,255,.14)) saturate(.92)}
.cat.sel{color:#fff;opacity:1;transform:scale(1.16)} .cat.sel img{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)) drop-shadow(0 0 9px rgba(255,255,255,.95)) drop-shadow(0 0 24px rgba(255,255,255,.45)) brightness(1.28);animation:iconBreathe 1.8s ease-in-out infinite} .cat.sel svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)) drop-shadow(0 0 9px rgba(255,255,255,.95)) drop-shadow(0 0 24px rgba(255,255,255,.45)) brightness(1.28);animation:iconBreathe 1.8s ease-in-out infinite} @keyframes iconBreathe{0%,100%{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)) drop-shadow(0 0 7px rgba(255,255,255,.75)) drop-shadow(0 0 18px rgba(255,255,255,.3)) brightness(1.18)}50%{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)) drop-shadow(0 0 13px rgba(255,255,255,1)) drop-shadow(0 0 30px rgba(255,255,255,.55)) brightness(1.35)}}
.cat .clab{margin-top:7px;font-size:15.5px;font-weight:500;letter-spacing:.02em;opacity:0;transition:opacity .25s;white-space:nowrap}
.cat.sel .clab{opacity:1;text-shadow:0 0 8px rgba(255,255,255,.95),0 0 20px rgba(255,255,255,.6);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{text-shadow:0 0 6px rgba(255,255,255,.7)}50%{text-shadow:0 0 14px rgba(255,255,255,1),0 0 28px rgba(255,255,255,.75)}}
#sub{position:absolute;top:238px;z-index:9;min-width:520px;transition:opacity .28s,transform .28s}

.srow{display:flex;align-items:center;gap:16px;height:59px;cursor:pointer;color:var(--dim);font-size:21px}

#crumb{position:absolute;top:226px;font-size:11px;color:var(--dim);z-index:9}

#panel.open{transform:none}
#panel .pk{font-size:12px;color:var(--dim)} #panel h2{font-size:19px;margin:10px 0 8px;font-weight:600}
.prow{height:38px;display:flex;align-items:center;font-size:15px;color:var(--dim);cursor:pointer}
.prow.sel{color:#fff;font-weight:600;text-shadow:0 0 9px rgba(255,255,255,.95)}
.prow.ctx{font-size:12px;height:26px}
#hint{position:absolute;left:16px;bottom:12px;font-size:11px;color:rgba(255,255,255,.55);z-index:20;text-shadow:0 1px 4px #000}
#toast{position:absolute;left:50%;bottom:42px;transform:translate(-50%,16px);background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.35);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:82%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#snd{position:absolute;right:16px;bottom:10px;z-index:22;display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,.72);text-shadow:0 1px 4px #000;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:4px 10px;cursor:pointer;backdrop-filter:blur(4px)}

#app.on{opacity:1;pointer-events:auto}
#app h1{font-size:28px;font-weight:600} #app .rule{height:1px;background:rgba(255,255,255,.55);width:72%;margin:12px 0 8px}

}

function openApp(title,subt,rows,foot){appOpen=true;const a=$('#app');a.innerHTML=`<h1>${title}</h1><div class="rule"></div><div class="sub2"><span>${subt.split('|')[0]||''}</span><span>${subt.split('|')[1]||''}</span></div>`+rows.map((r,i)=>`<div class="arow${i===0?' sel':''}">${r}</div>`).join('')+`<div class="foot">${foot} · Esc / ○ 返回 XMB</div>`;a.classList.add('on');a.querySelectorAll('.arow').forEach((e,i)=>e.onclick=()=>{a.querySelectorAll('.arow').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');click(760,.05)})}
function openSel(){
 const name=CATS[ci].items[si][0];
 if(panelOpen){applyPreset();return}
 if(CATS[ci].id==='settings'&&si===1){panelOpen=true;$('#panel').classList.add('open');renderPreset();toast('Global preset — ← → 或 Enter 切换主题');return}
 if(CATS[ci].id==='music'&&si>0){openApp('Music Player','No Vacation — Waltzing Back',['Waltzing Back — No Vacation'],'<div id="player"><div>♪ Waltzing Back</div><div class="controls">|◀ ◀◀ ❚❚ ▶| ▶ ■</div><br><progress value="3" max="192"></progress><div>00:00:03 / 00:03:12</div></div>');return}
 if(APPS[name]){const a=APPS[name];openApp(a[0],a[1],a[2],a[3]);return}
 if(CATS[ci].id==='discord'){toast('Discord · Demo preview — '+name);return}
 toast((CATS[ci].id==='games'?'Launching · ':'Opening · ')+name+'  ·  Demo preview');
}
function closeTop(){if(appOpen){appOpen=false;$('#app').classList.remove('on');return true}if(panelOpen){panelOpen=false;$('#panel').classList.remove('open');return true}return false}
function move(dx,dy){ const _dx=dx,_dy=dy;
 if(appOpen)return;
 if(panelOpen){ if(dy)pi=(pi+dy+PRESETS.length)%PRESETS.length,renderPreset(),click(700,.04); if(dx){pi=(pi+dx+PRESETS.length)%PRESETS.length;applyPreset()} return}
 if(dx){ci=(ci+dx+CATS.length)%CATS.length;si=0;sub.classList.add('switch');setTimeout(()=>sub.classList.remove('switch'),180)}
 if(dy){si=(si+dy+CATS[ci].items.length)%CATS[ci].items.length}
 render(); blip(_dx?740:580,.045,.05);
}
addEventListener('keydown',e=>{unlock();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft')move(-1,0);else if(e.key==='ArrowRight')move(1,0);else if(e.key==='ArrowUp')move(0,-1);else if(e.key==='ArrowDown')move(0,1);
 else if(e.key.toLowerCase()==='m'){toggleBgm()}else if(e.key==='Enter'||e.key.toLowerCase()==='x'){blip(920,.06,.06);setTimeout(()=>blip(1320,.05,.035),45);openSel()}else if(e.key==='Escape'||e.key.toLowerCase()==='o'){if(closeTop())blip(420,.06,.05)} });
$('#stage').addEventListener('wheel',e=>{e.preventDefault();move(0,e.deltaY>0?1:-1)},{passive:false});
let bgmOn=true,bgmStarted=false,bgmGain=null,sfxVol=.9,chordTimer=null,nextChord=0,chordIdx=0;
const CHORDS=[[130.81,196,261.63,329.63,493.88],[110,164.81,220,261.63,392],[87.31,130.81,174.61,220,329.63],[98,146.83,196,246.94,392]];
function unlock(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); startBgm()}
function blip(f=700,d=.05,v=.05){if(!audioCtx)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v*sfxVol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02)}
function click(f,d){blip(f,d,.06)}
function padNote(f,t,dur,peak){const g=audioCtx.createGain(),fl=audioCtx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=720;fl.Q.value=.4;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+2.6);g.gain.setValueAtTime(peak,t+dur-2.4);g.gain.linearRampToValueAtTime(0,t+dur+.1);[0,4].forEach(det=>{const o=audioCtx.createOscillator();o.type=det?'triangle':'sine';o.frequency.value=f;o.detune.value=det-2;o.connect(fl);o.start(t);o.stop(t+dur+.2)});fl.connect(g).connect(bgmGain)}
function bell(f,t,v){const o=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.01;const g2=audioCtx.createGain();g2.gain.value=.18;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(g);o2.connect(g2).connect(g);g.connect(bgmGain);o.start(t);o2.start(t);o.stop(t+2.3);o2.stop(t+2.3)}
function scheduleChord(){if(!audioCtx||!bgmGain)return;const dur=8,t=Math.max(nextChord,audioCtx.currentTime+.05),ch=CHORDS[chordIdx%CHORDS.length];ch.forEach(f=>padNote(f,t,dur,.028));[4,3,2,4,1].forEach((n,i)=>bell(ch[n%ch.length]*2,t+.6+i*1.45,.020));chordIdx++;nextChord=t+dur}
function startBgm(){if(!audioCtx||bgmStarted)return;bgmStarted=true;bgmGain=audioCtx.createGain();bgmGain.gain.value=bgmOn?+$('#vol').value/100*.3:0;bgmGain.connect(audioCtx.destination);nextChord=audioCtx.currentTime+.1;scheduleChord();chordTimer=setInterval(()=>{if(audioCtx&&nextChord<audioCtx.currentTime+1.2)scheduleChord()},400);updSnd()}
function updSnd(){$('#sndLab').textContent=bgmOn?'BGM 开':'BGM 关';$('#sndIco').textContent=bgmOn?'♪':'✕';$('#snd').style.opacity=bgmOn?1:.55}
function toggleBgm(){bgmOn=!bgmOn;unlock();if(bgmGain)bgmGain.gain.linearRampToValueAtTime(bgmOn?+$('#vol').value/100*.3:0,audioCtx.currentTime+.4);updSnd();toast(bgmOn?'BGM 开 · 原创氛围音乐':'BGM 关')}
$('#snd').addEventListener('click',e=>{if(e.target.id==='vol')return;toggleBgm()});
$('#vol').addEventListener('input',e=>{unlock();if(bgmGain&&bgmOn)bgmGain.gain.linearRampToValueAtTime(+e.target.value/100*.3,audioCtx.currentTime+.15)});
// clock
function tick(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,10000);
// waves v3-silk: broad satin ribbons (offscreen low-res = natural silk blur)
const cv=$('#waves'),ctx=cv.getContext('2d');let t=0;
const W=960,H=544,OW=480,OH=272,SC=OW/W;
const off=document.createElement('canvas');off.width=OW;off.height=OH;const oc=off.getContext('2d');
// fine grain tile
const nz=document.createElement('canvas');nz.width=nz.height=128;{const n=nz.getContext('2d'),im=n.createImageData(128,128);for(let i=0;i<im.data.length;i+=4){const v=118+Math.random()*90;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}n.putImageData(im,0,0)}
const PAL={emerald:{light:0,core:[205,255,226],mid:[61,255,158],deep:[0,168,92]},
pearl:{light:1,core:[255,255,255],mid:[226,232,230],deep:[148,162,158]},
champagne:{light:1,core:[255,240,205],mid:[196,158,96],deep:[122,88,40]},
navy:{light:0,core:[224,240,255],mid:[110,168,255],deep:[34,84,190]},
burgundy:{light:0,core:[255,196,210],mid:[255,110,150],deep:[150,28,68]}};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
// each sheet: baseY, long-wave amp, thickness(satin!), phase, drift speed, tilt
const SHEETS=[
 {y:318,amp:20,amp2:9,thick:172,ph:0.0,sp:0.55,crest:0.34,a:0.95},
 {y:352,amp:26,amp2:12,thick:196,ph:2.4,sp:0.38,crest:0.42,a:0.48},
 {y:288,amp:14,amp2:7,thick:118,ph:4.4,sp:0.72,crest:0.30,a:0.30}];
function centerY(r,x,tt){return r.y+Math.sin(x*0.0032+tt*r.sp+r.ph)*r.amp+Math.sin(x*0.0011-tt*r.sp*0.53+r.ph*1.7)*r.amp2+Math.sin(x*0.009+tt*r.sp*0.8+r.ph)*3}
function sheetPath(c,r,tt,dy){c.beginPath();const pts=[];for(let x=-20;x<=W+20;x+=10){const y=centerY(r,x,tt),w=r.thick*(0.88+0.16*Math.sin(x*0.0021+tt*0.4+r.ph*2));pts.push([x,y,w])}
 pts.forEach((p,i)=>{const yy=p[1]-p[2]*r.crest+(dy||0);i?c.lineTo(p[0]*SC,yy*SC):c.moveTo(p[0]*SC,yy*SC)});
 for(let i=pts.length-1;i>=0;i--){const p=pts[i];c.lineTo(p[0]*SC,(p[1]+p[2]*(1-r.crest)+(dy||0))*SC)}c.closePath();return pts}
function drawSheet(c,r,tt,P){
 const top=(r.y-r.thick)*SC,bot=(r.y+r.thick)*SC,g=c.createLinearGradient(0,top,0,bot),cr=r.crest;
 // satin cross-section: invisible edge -> specular crest -> luminous body -> long fade
 g.addColorStop(0,rgba(P.mid,0));g.addColorStop(Math.max(0,cr-0.16),rgba(P.mid,0.03*r.a));
 g.addColorStop(cr-0.045,rgba(P.mid,(P.light?0.34:0.15)*r.a));g.addColorStop(cr,rgba(P.core,(P.light?0.85:0.40)*r.a));
 g.addColorStop(cr+0.055,rgba(P.mid,(P.light?0.42:0.23)*r.a));g.addColorStop(cr+0.30,rgba(P.deep,(P.light?0.16:0.065)*r.a));
 g.addColorStop(Math.min(0.97,cr+0.55),rgba(P.deep,(P.light?0.05:0.04)*r.a));g.addColorStop(1,rgba(P.deep,0));
 sheetPath(c,r,tt,0);c.fillStyle=g;c.fill();
 // soft shadow fold just under crest (gives fabric thickness on light themes too)
 c.save();sheetPath(c,r,tt,0);c.clip();
 for(let f=0;f<4;f++){c.beginPath();for(let x=-20;x<=W+20;x+=10){const y=centerY(r,x,tt)+14+f*30+Math.sin(x*0.004+tt*0.5+r.ph+f)*5;x>-20?c.lineTo(x*SC,y*SC):c.moveTo(x*SC,y*SC)}
  c.strokeStyle=rgba(f%2?P.core:P.deep,(f%2?0.13:0.10)*r.a);c.lineWidth=(f%2?9:14)*SC+2;c.stroke()}
 // travelling specular sheen along the sheet
 const sx=((tt*36+r.ph*260)%(W+520))-260,sg=c.createLinearGradient(sx*SC,0,(sx+300)*SC,0);
 sg.addColorStop(0,rgba(P.core,0));sg.addColorStop(0.5,rgba(P.core,P.light?0.16:0.13));sg.addColorStop(1,rgba(P.core,0));
 c.fillStyle=sg;c.fillRect(0,0,OW,OH);c.restore();
 // crest highlight: 2 soft strokes (low-res upscale blurs them into silk, not neon)
 c.beginPath();for(let x=-20;x<=W+20;x+=10){const y=centerY(r,x,tt)-r.thick*r.crest*(0.88+0.16*Math.sin(x*0.0021+tt*0.4+r.ph*2));x>-20?c.lineTo(x*SC,y*SC):c.moveTo(x*SC,y*SC)}
 c.strokeStyle=rgba(P.core,(P.light?0.55:0.68)*r.a);c.lineWidth=3.0;c.stroke();
 c.strokeStyle=rgba(P.core,0.20*r.a);c.lineWidth=9;c.stroke();
}
function draw(){t+=0.0042;const P=PAL[stage.dataset.theme]||PAL.emerald;
 oc.clearRect(0,0,OW,OH);oc.globalCompositeOperation='source-over';
 SHEETS.forEach(r=>drawSheet(oc,r,t,P));
 ctx.clearRect(0,0,W,H);
 // faint large-scale sheen drifting behind UI
 const shx=480+Math.sin(t*0.35)*260,sh=ctx.createRadialGradient(shx,330,40,shx,330,560);
 sh.addColorStop(0,rgba(P.mid,P.light?0.10:0.07));sh.addColorStop(1,rgba(P.mid,0));ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation=P.light?'source-over':'lighter';
 ctx.globalAlpha=P.light?0.96:0.88;ctx.drawImage(off,0,0,W,H);
 ctx.save();ctx.filter='blur(13px)';ctx.globalAlpha=P.light?0.38:0.32;ctx.drawImage(off,0,0,W,H);ctx.restore();
 // fine silk grain
 ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.045;const pat=ctx.createPattern(nz,'repeat');ctx.translate(-(t*9%128),0);ctx.fillStyle=pat;ctx.fillRect(0,180,W+128,364);ctx.restore();
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 requestAnimationFrame(draw)}
draw();
// optional deep link, e.g. ?cat=settings&sub=1&panel=1
const q=new URLSearchParams(location.search); const qc=CATS.findIndex(c=>c.id===q.get('cat')); if(qc>=0){ci=qc;si=Math.min(+(q.get('sub')||0),CATS[ci].items.length-1)} render();
if(q.get('panel')==='1'&&CATS[ci].id==='settings'){panelOpen=true;$('#panel').classList.add('open');renderPreset()}
